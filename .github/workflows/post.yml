name: Post to Instagram

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run poster
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python3 scripts/post.py

      - name: Commit updated queue state
        run: |
          git config user.name "abwin-ig-bot"
          git config user.email "actions@users.noreply.github.com"
          git add queue.json
          git diff --cached --quiet || git commit -m "chore: mark post as published [skip ci]"
          git push
